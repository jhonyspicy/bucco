<div class="ultraHall">
  <template v-if="!ok">
    <div class="ultraHall__control">
      <button @click="start($event)" class="startButton">START</button>
    </div>
  </template>
  <template v-else>
    <div class="ultraHall__info">
      <div class="ultraHall__info__allTotalInfo">
        <h2 class="ultraHall__info__title">お店全体</h2>
        <TotalInfo v-bind:totalInfo="allTotalInfo"></TotalInfo>
      </div>
      <ul class="ultraHall__info__islandTotalInfo">
        <li class="ultraHall__info__islandTotalInfo__item" v-for="numberList in islandNumberList">
          <h2 class="ultraHall__info__title">{{numberList | min}} ～ {{numberList | max}}</h2>
          <TotalInfo v-bind:totalInfo="getTotalInfo(numberList)"></TotalInfo>
        </li>
      </ul>
    </div>
    <div class="ultraHall__contents">
      <Equipment
              v-for="params in paramsList"
              v-bind:key="null"
              v-bind:params="params"
      ></Equipment>
    </div>
  </template>
</div>
