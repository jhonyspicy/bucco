<div class="ultraHall">
  <div class="ultraHall__info">
    <TotalInfo v-bind:totalInfo="totalInfo"></TotalInfo>
  </div>
  <div class="ultraHall__control">
    <button @click="start($event)" v-if="!ok" class="startButton">START</button>
  </div>
  <div class="ultraHall__contents">
    <Equipment
      v-for="params in paramsList"
      v-bind:key="null"
      v-bind:params="params"
    ></Equipment>
  </div>
</div>
