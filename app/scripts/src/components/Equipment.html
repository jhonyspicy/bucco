<div class="ultraEquipment">
  <div class="ultraEquipment__info" v-if="params || ok">
    <h1 class="ultraEquipment__info__name" @click="toggleShow">{{name || '待たれよ...'}}</h1>
    <ul class="ultraEquipment__info__totalInfo">
      <li class="ultraEquipment__info__totalInfo__day">
        <h2 class="ultraEquipment__info__totalInfo__day__title">総獲得枚数</h2>
        <h2 class="ultraEquipment__info__totalInfo__day__title">総稼働量</h2>
      </li>
      <li v-for="(dayInfo, index) in totalInfo" class="ultraEquipment__info__totalInfo__day">
        <div class="ultraEquipment__info__totalInfo__day__item"><span class="ultraEquipment__info__totalInfo__day__item__key">{{index}}日前({{index | dayBeforeWeek}})</span><span class="ultraEquipment__info__totalInfo__day__item__value">{{dayInfo.nowCoin | addComma}}</span></div>
        <div class="ultraEquipment__info__totalInfo__day__item"><span class="ultraEquipment__info__totalInfo__day__item__key">{{index}}日前({{index | dayBeforeWeek}})</span><span class="ultraEquipment__info__totalInfo__day__item__value">{{dayInfo.operation | addComma}}</span></div>
      </li>
    </ul>
  </div>
  <div class="ultraEquipment__control">
    <button @click="start($event)" v-if="!params && !ok" class="startButton">START</button>
  </div>

  <div class="ultraEquipment__islands" v-bind:class="{ show : isShow }">
    <template v-for="island in islands">
      <Island v-bind:islandData="island" />
    </template>
  </div>
</div>
